[project]
name = "alignlab"
version = "0.1.0"
description = "Reproducible experiments for small language model post-training"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["torch>=2.3", "transformers>=4.51", "datasets>=3.0", "peft>=0.15", "trl>=0.17", "accelerate>=1.0", "pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
