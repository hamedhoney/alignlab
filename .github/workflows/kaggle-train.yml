name: Train Qwen3 on Kaggle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six
          python -m pip check

      - name: Prepare notebook
        run: |
          mkdir -p kaggle/run
          cp notebooks/01_qlora_finetuning.ipynb kaggle/run/
          cp kaggle/kernel-metadata.json kaggle/run/

      - name: Submit Kaggle training
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push \
            -p kaggle/run \
            --accelerator NvidiaTeslaT4

      - name: Show notebook URL
        run: |
          echo "https://www.kaggle.com/code/hamedhani/01-qlora-finetuning"