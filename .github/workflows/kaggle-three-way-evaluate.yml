name: Evaluate Base SFT DPO on Kaggle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alignlab-three-way-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KERNEL_ID: hamedhani/04-alignlab-three-way-evaluation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install kaggle six 'huggingface_hub>=0.30,<1'
      - name: Stage DPO adapter and prepare notebook
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          test -n "$HF_TOKEN"
          python scripts/prepare_three_way_evaluation.py
          cp notebooks/04_three_way_evaluation.ipynb kaggle/three-way-run/
      - name: Validate Kaggle input attachments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import json
          from pathlib import Path

          path = Path("kaggle/three-way-run/kernel-metadata.json")
          metadata = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "hamedhani/alignlab-qlora-adapter",
              "hamedhani/alignlab-dpo-adapter",
          }
          actual = set(metadata.get("dataset_sources", []))
          print("Kaggle dataset sources:", sorted(actual))
          if actual != expected:
              raise SystemExit(f"Incorrect dataset sources: {actual}")
          if metadata.get("id") != "hamedhani/04-alignlab-three-way-evaluation":
              raise SystemExit("Unexpected kernel ID")
          if metadata.get("code_file") != "04_three_way_evaluation.ipynb":
              raise SystemExit("Unexpected code file")
          PYCODE
      - name: Submit evaluation
        run: kaggle kernels push -p kaggle/three-way-run --accelerator NvidiaTeslaT4
      - name: Wait for evaluation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            set +e
            STATUS=$(kaggle kernels status "$KERNEL_ID" 2>&1)
            CODE=$?
            set -e
            echo "Attempt $attempt: $STATUS"
            if [ "$CODE" -ne 0 ]; then
              if echo "$STATUS" | grep -Eqi '404|GetKernelSessionStatus'; then
                sleep 30
                continue
              fi
              exit "$CODE"
            fi
            if echo "$STATUS" | grep -Fq 'KernelWorkerStatus.COMPLETE'; then
              echo 'Kaggle evaluation completed.'
              exit 0
            fi
            if echo "$STATUS" | grep -Eq 'KernelWorkerStatus\.(ERROR|FAILED|CANCELLED|CANCELED)'; then
              echo 'Kaggle evaluation failed.' >&2
              exit 1
            fi
            sleep 30
          done
          echo 'Timed out waiting for evaluation.' >&2
          exit 1
      - name: Summary
        if: success()
        run: |
          echo '## Three-way evaluation complete' >> "$GITHUB_STEP_SUMMARY"
          echo 'Kaggle: https://www.kaggle.com/code/hamedhani/04-alignlab-three-way-evaluation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Run Publish Three-Way Evaluation Results to commit the JSON report.' >> "$GITHUB_STEP_SUMMARY"
