
name: Train Qwen3 on Colab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-colab:
    name: Prepare Colab Training
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install nbformat ruff

      - name: Validate notebook
        run: |
          python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/01_qlora_finetuning.ipynb', as_version=4))"
          ruff check notebooks/01_qlora_finetuning.ipynb

      - name: Generate Colab link
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          URL="https://colab.research.google.com/github/${REPO}/blob/${BRANCH}/notebooks/01_qlora_finetuning.ipynb"

          echo "## AlignLab - Colab Training" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open QLoRA notebook in Colab](${URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Select a GPU runtime and run the notebook." >> "$GITHUB_STEP_SUMMARY"
