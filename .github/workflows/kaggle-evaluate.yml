name: Evaluate Qwen3 on Kaggle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alignlab-kaggle-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KERNEL_ID: hamedhani/02-alignlab-model-evaluation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install CLI and Hub client
        run: python -m pip install kaggle six 'huggingface_hub>=0.30,<1'

      - name: Stage private adapter and prepare metadata
        run: |
          test -n "$KAGGLE_API_TOKEN"
          test -n "$HF_TOKEN"
          python scripts/prepare_kaggle_evaluation.py
          cp notebooks/02_model_evaluation.ipynb kaggle/eval-run/

      - name: Submit evaluation notebook
        run: kaggle kernels push -p kaggle/eval-run --accelerator NvidiaTeslaT4

      - name: Wait for evaluation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            STATUS=$(kaggle kernels status "$KERNEL_ID")
            echo "Attempt $attempt: $STATUS"
            if echo "$STATUS" | grep -Eqi 'complete'; then
              exit 0
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancel'; then
              exit 1
            fi
            sleep 120
          done
          echo 'Timed out waiting for Kaggle evaluation' >&2
          exit 1

      - name: Download evaluation outputs
        run: |
          mkdir -p artifacts/evaluation
          kaggle kernels output "$KERNEL_ID" -p artifacts/evaluation
          find artifacts/evaluation -type f
          find artifacts/evaluation -name model_comparison.json -print -quit | grep -q .

      - name: Save evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alignlab-model-evaluation
          path: artifacts/evaluation/
          retention-days: 30

      - name: Summary
        run: |
          echo '## AlignLab Evaluation Complete' >> "$GITHUB_STEP_SUMMARY"
          echo 'Kaggle: https://www.kaggle.com/code/hamedhani/02-alignlab-model-evaluation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the evaluation report from this run\x27s artifacts.' >> "$GITHUB_STEP_SUMMARY"
