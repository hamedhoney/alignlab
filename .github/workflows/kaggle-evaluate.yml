name: Evaluate Qwen3 on Kaggle

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alignlab-kaggle-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KERNEL_ID: hamedhani/02-alignlab-model-evaluation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            kaggle \
            six \
            "huggingface_hub>=0.30,<1"

      - name: Stage adapter and prepare notebook
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KAGGLE_API_TOKEN"
          test -n "$HF_TOKEN"

          python scripts/prepare_kaggle_evaluation.py

          mkdir -p kaggle/eval-run

          cp notebooks/02_model_evaluation.ipynb \
            kaggle/eval-run/

          python - <<'PYCODE'
          import json
          from pathlib import Path

          metadata_path = Path(
              "kaggle/eval-run/kernel-metadata.json"
          )

          if not metadata_path.is_file():
              raise FileNotFoundError(metadata_path)

          metadata = json.loads(
              metadata_path.read_text(encoding="utf-8")
          )

          assert metadata["id"] == (
              "hamedhani/02-alignlab-model-evaluation"
          )

          assert metadata["code_file"] == (
              "02_model_evaluation.ipynb"
          )

          assert (
              "hamedhani/alignlab-qlora-adapter"
              in metadata["dataset_sources"]
          )

          print(
              "Evaluation metadata verified:",
              metadata["dataset_sources"],
          )
          PYCODE

      - name: Submit Kaggle evaluation
        shell: bash
        run: |
          set -euo pipefail

          kaggle kernels push \
            -p kaggle/eval-run \
            --accelerator NvidiaTeslaT4

      - name: Wait for Kaggle evaluation
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            STATUS=$(kaggle kernels status "$KERNEL_ID")

            echo "Attempt $attempt:"
            echo "$STATUS"

            if echo "$STATUS" | grep -Eqi \
              'status:?[[:space:]]*complete|status:?[[:space:]]*complete[d]?'; then
              echo "Kaggle evaluation completed."
              exit 0
            fi

            if echo "$STATUS" | grep -Eqi \
              'status:?[[:space:]]*(error|failed|cancelled|canceled)'; then
              echo "Kaggle evaluation failed."
              exit 1
            fi

            sleep 120
          done

          echo "Timed out waiting for Kaggle evaluation." >&2
          exit 1

      - name: Download evaluation outputs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/evaluation

          kaggle kernels output "$KERNEL_ID" \
            -p artifacts/evaluation

          echo "Downloaded files:"
          find artifacts/evaluation -type f

          REPORT=$(find artifacts/evaluation \
            -type f \
            -name model_comparison.json \
            -print -quit)

          if [ -z "$REPORT" ]; then
            echo "model_comparison.json not found." >&2
            exit 1
          fi

          echo "Evaluation report found: $REPORT"

      - name: Validate and commit evaluation report
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          REPORT=$(find artifacts/evaluation \
            -type f \
            -name model_comparison.json \
            -print -quit)

          test -n "$REPORT"

          python -m json.tool "$REPORT" > /dev/null

          DEST="results/evaluation/run-${RUN_ID}-attempt-${RUN_ATTEMPT}"

          mkdir -p "$DEST"

          cp "$REPORT" "$DEST/model_comparison.json"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$DEST/model_comparison.json"

          git commit -m \
            "results: save Kaggle evaluation run ${RUN_ID}"

          git fetch origin "$GITHUB_REF_NAME"

          git rebase "origin/$GITHUB_REF_NAME"

          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Save evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alignlab-model-evaluation
          path: artifacts/evaluation/
          retention-days: 30
          if-no-files-found: warn

      - name: Generate workflow summary
        if: success()
        shell: bash
        run: |
          echo "## AlignLab Evaluation Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Resources" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Kaggle: https://www.kaggle.com/code/hamedhani/02-alignlab-model-evaluation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Hugging Face: https://huggingface.co/hamedready/alignlab-qwen3-1.7b-qlora" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Evaluation report committed to results/evaluation/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts retained for 30 days." >> "$GITHUB_STEP_SUMMARY"
