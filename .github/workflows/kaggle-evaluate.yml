name: Evaluate Qwen3 on Kaggle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alignlab-kaggle-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KERNEL_ID: hamedhani/02-alignlab-model-evaluation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install kaggle six 'huggingface_hub>=0.30,<1'

      - name: Stage adapter and prepare evaluation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          test -n "$HF_TOKEN"
          python scripts/prepare_kaggle_evaluation.py
          cp notebooks/02_model_evaluation.ipynb kaggle/eval-run/
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('kaggle/eval-run/kernel-metadata.json').read_text())
          assert metadata['id'] == 'hamedhani/02-alignlab-model-evaluation'
          assert metadata['code_file'] == '02_model_evaluation.ipynb'
          assert 'hamedhani/alignlab-qlora-adapter' in metadata['dataset_sources']
          assert metadata['title'] == '02 AlignLab Model Evaluation'
          print('Validated notebook metadata and dataset attachment.')
          PY

      - name: Submit evaluation
        run: kaggle kernels push -p kaggle/eval-run --accelerator NvidiaTeslaT4

      - name: Wait for Kaggle evaluation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            set +e
            STATUS=$(kaggle kernels status "$KERNEL_ID" 2>&1)
            CODE=$?
            set -e
            echo "Check $attempt: $STATUS"
            if [ "$CODE" -ne 0 ]; then
              if echo "$STATUS" | grep -Eqi '404|GetKernelSessionStatus|not found'; then
                if [ "$attempt" -le 20 ]; then
                  sleep 30
                  continue
                fi
              fi
              echo 'Kaggle status request failed.' >&2
              exit 1
            fi
            if echo "$STATUS" | grep -Fq 'KernelWorkerStatus.COMPLETE'; then
              echo 'Evaluation complete.'
              exit 0
            fi
            if echo "$STATUS" | grep -Eq 'KernelWorkerStatus\.(ERROR|FAILED|CANCELLED|CANCELED)'; then
              echo 'Kaggle evaluation failed.' >&2
              exit 1
            fi
            sleep 30
          done
          echo 'Timed out waiting for Kaggle evaluation.' >&2
          exit 1

      - name: Summary
        if: success()
        run: |
          echo '## Kaggle evaluation completed' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Notebook: https://www.kaggle.com/code/hamedhani/02-alignlab-model-evaluation' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Next: Run **Publish Kaggle Evaluation Results** in GitHub Actions to save the report without rerunning evaluation.' >> "$GITHUB_STEP_SUMMARY"
